name: eval

# Nightly, not per-push: on the free tier a full run takes several minutes,
# and the numbers only move when the agent's prompt, its tools, the rules or
# the retrieval change.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    # Skipped, not failed, until the secrets exist, so the repo doesn't post a
    # red run every night before it's been given a database.
    env:
      READY: ${{ secrets.DATABASE_URL != '' && secrets.GOOGLE_API_KEY != '' && secrets.DATA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.READY == 'true'
      - uses: actions/setup-node@v4
        if: env.READY == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: env.READY == 'true'

      - name: Review the eval cases
        if: env.READY == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
        # The regulations must be in the database before any case can cite
        # them; re-ingesting is idempotent and picks up an IRDAI revision.
        run: |
          npm run migrate
          npm run ingest-regulations
          npm run eval

      - uses: actions/upload-artifact@v4
        if: env.READY == 'true'
        with:
          name: eval-results
          path: eval/results.md
