name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # No Postgres service container: the isolation suite runs PGlite in-process.
      - name: Test
        run: npm test

      - name: Build
        run: npx next build
        env:
          SESSION_SECRET: not-a-real-secret-only-here-so-the-build-boots

      # Only on main, and only after everything above is green. Vercel's own Git
      # integration is disabled in vercel.json so that this is the only path to
      # production — otherwise Vercel deploys on push before CI has an opinion,
      # and the tests above become decorative.
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
